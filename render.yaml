services:
  - type: web
    name: ai-cfo-slack-bot
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile=false && pnpm --filter slack-bot build
    startCommand: pnpm --filter slack-bot start
    healthCheckPath: /health
    envVars:
      - key: SLACK_BOT_PORT
        value: "3001"
      - key: NODE_VERSION
        value: "20"
      - key: SHARED_CHAT_ENDPOINT
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_STATE_SECRET
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: CHAT_API_KEY
        sync: false
